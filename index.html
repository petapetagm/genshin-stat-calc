<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ステータスバランス計算ツール</title>
  <!-- 外部CSSファイルを読み込み -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>ステータスバランス計算ツール</h1>

  <div class="app-container">
    
    <!-- 左側：入力 ＆ 計算結果 -->
    <div class="left-panel">
      <h2>ステータス入力</h2>

      <div class="input-group">
        <label for="baseAtk">基礎攻撃力：</label>
        <input type="number" id="baseAtk" value="900">
      </div>

      <div class="input-group">
        <label for="shownAtk">表示攻撃力：</label>
        <input type="number" id="shownAtk" value="3000">
      </div>

      <div class="input-group">
        <label for="CRT">会心率(%)：</label>
        <input type="number" id="CRT" value="100">``
      </div>

      <div class="input-group">
        <label for="CRD">会心ダメージ(%)：</label>
        <input type="number" id="CRD" value="200">
      </div>

      <div class="input-group">
        <label for="dmgBonus">与ダメバフ(%)：</label>
        <input type="number" id="dmgBonus" value="46.6">
      </div>

      <div class="input-group">
        <label for="elementMastery">元素熟知：</label>
        <input type="number" id="elementMastery" value="200">
      </div>

      <div class="result-box">
        <h3>【計算結果】</h3>
        <p>攻撃比率：<strong id="atkRatio">0%</strong></p>
        <p>会心補正：<strong id="crtRatio">100.0%</strong></p>
        <p>与ダメ補正：<strong id="dmgRatio">100.0%</strong></p>
        <p>月・星反応ボーナス：<strong id="emBonus">0.0%</strong></p>
      </div>
    </div>

    <!-- 右側：フィルター ＆ キャラクターアイコン一覧 -->
    <div class="right-panel">
      <h2>キャラクター選択</h2>

      <div class="filter-group">
        <!-- 元素フィルター -->
        <div class="filter-item">
          <label for="element-filter">元素:</label>
          <select id="element-filter">
            <option value="all">すべて</option>
            <option value="pyro">炎 (Pyro)</option>
            <option value="hydro">水 (Hydro)</option>
            <option value="anemo">風 (Anemo)</option>
            <option value="electro">雷 (Electro)</option>
            <option value="dendro">草 (Dendro)</option>
            <option value="cryo">氷 (Cryo)</option>
            <option value="geo">岩 (Geo)</option>
          </select>
        </div>

        <!-- 武器種フィルター -->
        <div class="filter-item">
          <label for="weapon-type-filter">武器種:</label>
          <select id="weapon-type-filter">
            <option value="all">すべて</option>
            <option value="sword">片手剣</option>
            <option value="claymore">両手剣</option>
            <option value="polearm">長柄武器</option>
            <option value="catalyst">法器</option>
            <option value="bow">弓</option>
          </select>
        </div>
      </div>

      <!-- キャラクターアイコン一覧表示エリア -->
      <div id="character-grid" class="character-grid"></div>

      <!-- 武器選択エリア -->
      <div class="weapon-select-section" style="margin-top: 20px;">
        <h2>武器選択</h2>
        <div class="input-group">
          <label for="weapon-select">装備武器：</label>
          <select id="weapon-select" disabled>
            <option value="">キャラクターを選択してください</option>
          </select>
        </div>
      </div>

    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
