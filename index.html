<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ステータスバランス計算ツール</title>
  <!-- 外部CSSファイルを読み込み -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>ステータスバランス計算ツール</h1>
  <div class="theme-switch-container">
    <button type="button" id="theme-toggle-btn" class="theme-btn">🌙 ダークモード</button>
  </div>

  <div class="app-container">


    <!-- 左側：フィルター ＆ キャラクターアイコン一覧 -->
    <div class="left-panel">
      <h2>キャラクター選択</h2>

      <div class="filter-group">
        <!-- 元素フィルター -->
        <div class="filter-item">
          <label for="element-filter">元素:</label>
          <select id="element-filter">
            <option value="all">すべて</option>
            <option value="pyro">炎 (Pyro)</option>
            <option value="hydro">水 (Hydro)</option>
            <option value="anemo">風 (Anemo)</option>
            <option value="electro">雷 (Electro)</option>
            <option value="dendro">草 (Dendro)</option>
            <option value="cryo">氷 (Cryo)</option>
            <option value="geo">岩 (Geo)</option>
          </select>
        </div>

        <!-- 武器種フィルター -->
        <div class="filter-item">
          <label for="weapon-type-filter">武器種:</label>
          <select id="weapon-type-filter">
            <option value="all">すべて</option>
            <option value="sword">片手剣</option>
            <option value="claymore">両手剣</option>
            <option value="polearm">長柄武器</option>
            <option value="catalyst">法器</option>
            <option value="bow">弓</option>
          </select>
        </div>
      </div>

      <!-- キャラクターアイコン一覧表示エリア -->
      <div id="character-grid" class="character-grid"></div>

      <!-- 武器選択エリア -->
      <div class="weapon-select-section" style="margin-top: 20px;">
        <h2>武器選択</h2>
        <div class="input-group">
          <label for="weapon-select">装備武器：</label>
          <select id="weapon-select" disabled>
            <option value="">キャラクターを選択してください</option>
          </select>
        </div>
      </div>

    </div>
    
  <!-- 右側：入力 ＆ 計算結果 -->
  <div class="right-panel">
    <h2>ステータス入力</h2>

    <!-- 聖遺物メインステータス選択エリア -->
    <div class="artifact-main-section">
      <h3>聖遺物メインステータス</h3>

      <!-- 時計 -->
      <div class="artifact-slot">
        <span class="slot-title">時計 (Sands)</span>
        <div class="option-grid" data-slot="sands">
          <button type="button" class="opt-btn" data-stat="atkPercent" data-num="46.6">攻撃%</button>
          <button type="button" class="opt-btn" data-stat="hpPercent" data-num="46.6">HP%</button>
          <button type="button" class="opt-btn" data-stat="defPercent" data-num="58.3">防御%</button>
          <button type="button" class="opt-btn" data-stat="em" data-num="187">熟知</button>
          <button type="button" class="opt-btn" data-stat="er" data-num="51.8">元チャ</button>
          <div class="empty-cell"></div>
          <div class="empty-cell"></div>
          <div class="empty-cell"></div>
        </div>
      </div>

      <!-- 杯 -->
      <div class="artifact-slot">
        <span class="slot-title">杯 (Goblet)</span>
        <div class="option-grid" data-slot="goblet">
          <button type="button" class="opt-btn" data-stat="atkPercent" data-num="46.6">攻撃%</button>
          <button type="button" class="opt-btn" data-stat="hpPercent" data-num="46.6">HP%</button>
          <button type="button" class="opt-btn" data-stat="defPercent" data-num="58.3">防御%</button>
          <button type="button" class="opt-btn" data-stat="em" data-num="187">熟知</button>
          <div class="empty-cell"></div>
          <div class="empty-cell"></div>
          <div class="empty-cell"></div>
          <button type="button" class="opt-btn" data-stat="dmgBonus" data-num="46.6">元素バフ</button>
        </div>
      </div>

      <!-- 冠 -->
      <div class="artifact-slot">
        <span class="slot-title">冠 (Circlet)</span>
        <div class="option-grid" data-slot="circlet">
          <button type="button" class="opt-btn" data-stat="atkPercent" data-num="46.6">攻撃%</button>
          <button type="button" class="opt-btn" data-stat="hpPercent" data-num="46.6">HP%</button>
          <button type="button" class="opt-btn" data-stat="defPercent" data-num="58.3">防御%</button>
          <button type="button" class="opt-btn" data-stat="em" data-num="187">熟知</button>
          <div class="empty-cell"></div>
          <button type="button" class="opt-btn" data-stat="crt" data-num="31.1">会心率</button>
          <button type="button" class="opt-btn" data-stat="crd" data-num="62.2">会心ダメ</button>
          <div class="empty-cell"></div>
        </div>
      </div>
    </div>

    <!-- 基礎攻撃力（キャラ・武器未選択時の初期表示） -->
<div class="input-group">
  <label for="baseAtk">基礎攻撃力：</label>
  <input type="number" id="baseAtk" value="0" class="no-spin">
</div>

  <!-- 攻撃力%（初期値 0%） -->
  <div class="input-group">
    <label for="atkPercent">攻撃力(%)：</label>
    <div class="stepper-container">
      <button type="button" class="step-btn" data-target="atkPercent" data-add="-46.6">-46.6%</button>
      <button type="button" class="step-btn" data-target="atkPercent" data-add="-5.0">-5.0%</button>
      <input type="number" id="atkPercent" value="0" step="0.1" class="no-spin">
      <button type="button" class="step-btn" data-target="atkPercent" data-add="5.0">+5.0%</button>
      <button type="button" class="step-btn" data-target="atkPercent" data-add="46.6">+46.6%</button>
    </div>
  </div>

  <div class="input-group">
    <label for="CRT">会心率(%)：</label>
    <div class="stepper-container">
      <button type="button" class="step-btn" data-target="CRT" data-add="-31.1">-31.1%</button>
      <button type="button" class="step-btn" data-target="CRT" data-add="-10">-10%</button>
      <button type="button" class="step-btn" data-target="CRT" data-add="-3.3">-3.3%</button>
      <input type="number" id="CRT" value="5.0" step="0.1" class="no-spin">
      <button type="button" class="step-btn" data-target="CRT" data-add="3.3">+3.3%</button>
      <button type="button" class="step-btn" data-target="CRT" data-add="10">+10%</button>
      <button type="button" class="step-btn" data-target="CRT" data-add="31.1">+31.1%</button>
    </div>
  </div>

  <!-- 会心ダメージ（初期値を基礎の50.0%に設定） -->
  <div class="input-group">
    <label for="CRD">会心ダメージ(%)：</label>
    <div class="stepper-container">
      <button type="button" class="step-btn" data-target="CRD" data-add="-62.2">-62.2%</button>
      <button type="button" class="step-btn" data-target="CRD" data-add="-10">-10%</button>
      <button type="button" class="step-btn" data-target="CRD" data-add="-6.6">-6.6%</button>
      <input type="number" id="CRD" value="50.0" step="0.1" class="no-spin">
      <button type="button" class="step-btn" data-target="CRD" data-add="6.6">+6.6%</button>
      <button type="button" class="step-btn" data-target="CRD" data-add="10">+10%</button>
      <button type="button" class="step-btn" data-target="CRD" data-add="62.2">+62.2%</button>
    </div>
  </div>

  <!-- 与ダメバフ（初期値 0%） -->
  <div class="input-group">
    <label for="dmgBonus">与ダメバフ(%)：</label>
    <div class="stepper-container">
      <button type="button" class="step-btn" data-target="dmgBonus" data-add="-46.6">-46.6%</button>
      <button type="button" class="step-btn" data-target="dmgBonus" data-add="-10">-10%</button>
      <input type="number" id="dmgBonus" value="0" step="0.1" class="no-spin">
      <button type="button" class="step-btn" data-target="dmgBonus" data-add="10">+10%</button>
      <button type="button" class="step-btn" data-target="dmgBonus" data-add="46.6">+46.6%</button>
    </div>
  </div>

    <!-- 元素熟知（初期値 0） -->
  <div class="input-group">
    <label for="elementMastery">元素熟知：</label>
    <div class="stepper-container">
      <button type="button" class="step-btn" data-target="elementMastery" data-add="-187">-187</button>
      <button type="button" class="step-btn" data-target="elementMastery" data-add="-50">-50</button>
      <button type="button" class="step-btn" data-target="elementMastery" data-add="-20">-20</button>
      <input type="number" id="elementMastery" value="0" class="no-spin">
      <button type="button" class="step-btn" data-target="elementMastery" data-add="20">+20</button>
      <button type="button" class="step-btn" data-target="elementMastery" data-add="50">+50</button>
      <button type="button" class="step-btn" data-target="elementMastery" data-add="187">+187</button>
    </div>
  </div>

  <!-- 【追加】月・星反応ボーナス -->
  <div class="input-group">
    <label for="lunarStarBonus">月・星反応ボーナス(%)：</label>
    <div class="stepper-container">
      <button type="button" class="step-btn" data-target="lunarStarBonus" data-add="-20">-20%</button>
      <button type="button" class="step-btn" data-target="lunarStarBonus" data-add="-5">-5%</button>
      <input type="number" id="lunarStarBonus" value="0" step="0.1" class="no-spin">
      <button type="button" class="step-btn" data-target="lunarStarBonus" data-add="5">+5%</button>
      <button type="button" class="step-btn" data-target="lunarStarBonus" data-add="20">+20%</button>
    </div>
  </div>

  <div class="result-box">
    <!-- タブ切替ボタン -->
    <div class="result-tabs">
      <button type="button" class="tab-btn active" data-tab="numeric">数値表示</button>
      <button type="button" class="tab-btn" data-tab="chart">グラフ表示</button>
    </div>

    <!-- 1. 数値表示コンテンツ -->
    <div id="numeric-tab" class="tab-content active">
      <!-- 実数ステータスグループ -->
      <div class="result-group">
        <div class="result-card primary">
          <span class="result-label">表示攻撃力</span>
          <strong id="finalShownAtk">0</strong>
        </div>
        <div class="result-card">
          <span class="result-label">表示HP</span>
          <strong id="finalShownHp">0</strong>
        </div>
        <div class="result-card">
          <span class="result-label">表示防御力</span>
          <strong id="finalShownDef">0</strong>
        </div>
      </div>

      <!-- 倍率・ボーナスグループ -->
      <div class="result-group grid-2">
        <div class="result-card">
          <span class="result-label">攻撃比率</span>
          <strong id="atkRatio">0%</strong>
        </div>
        <div class="result-card">
          <span class="result-label">会心補正</span>
          <strong id="crtRatio">100.0%</strong>
        </div>
        <div class="result-card">
          <span class="result-label">与ダメ補正</span>
          <strong id="dmgRatio">100.0%</strong>
        </div>
        <div class="result-card">
          <span class="result-label">月・星反応ボーナス</span>
          <strong id="emBonus">0.0%</strong>
        </div>
      </div>
    </div>

    <!-- 2. グラフ表示予定コンテンツ（プレースホルダー） -->
    <div id="chart-tab" class="tab-content">
      <div class="chart-container">
        <!-- 後で Chart.js 等を描画する canvas プレースホルダー -->
        <canvas id="statusChart"></canvas>
        <div class="chart-placeholder-text">
          <span>📊 グラフ描画エリア</span>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
